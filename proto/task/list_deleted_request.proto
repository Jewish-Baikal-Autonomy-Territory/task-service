edition = "2023";

package jbat.task;

import "google/api/field_behavior.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "buf/validate/validate.proto";
import "task/cursor.proto";

option features.field_presence = EXPLICIT;

message ListDeletedRequest {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      title: "ListDeletedRequest",
      description: "Transfer information about filtering conditions.",
      required: [
        "cursor"
      ]
    }

    example: '{"cursor":{"key":"2025-01-31T23:59:59Z","limit":"20"}}'
  };

  Cursor cursor = 1 [
    (buf.validate.field).required = true,

    json_name = "cursor",
    (google.api.field_behavior) = REQUIRED,
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
      title: "cursor",
      description: "Cursor that represents current position and output limit of tasks.",
      required: "true",
      format: "object",
      example: '{"key":"2025-01-31T23:59:59Z","limit":"20"}'
    }
  ];

  string group_id = 2 [
    (buf.validate.field).required = false,
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).string.example = "123e4567-e89b-12d3-a456-426614174001",

    json_name = "group_id",
    (google.api.field_behavior) = OPTIONAL,
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
      title: "group_id",
      description: "UUID of the group the task belongs to (optional).",
      required: "false",
      format: "string",
      pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$",
      example: '"123e4567-e89b-12d3-a456-426614174001"'
    }
  ];
}
