edition = "2023";

package jbat.task;

import "google/api/field_behavior.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "buf/validate/validate.proto";

option features.field_presence = EXPLICIT;

message RestoreTaskRequest {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      title: "RestoreTaskRequest",
      description: "Transfer information about a task to restore.",
      required: [
        "id"
      ]
    }

    example: '{"id":"123e4567-e89b-12d3-a456-426614174001"}'
  };

  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).string.example = "123e4567-e89b-12d3-a456-426614174001",

    json_name = "id",
    (google.api.field_behavior) = REQUIRED,
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
      title: "id",
      description: "ID of the task to restore.",
      required: "true",
      format: "string",
      example: '"123e4567-e89b-12d3-a456-426614174001"'
    }
  ];
}
